<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ethan Luke G. Laroscain // CS1A</title>
  <style>
    :root {
      --bg-deep: #030a06;
      --bg-canopy: #071910;
      --emerald: #34f5a3;
      --mint: #6ee7b7;
      --cyan: #22d3ee;
      --text-main: #ecfdf5;
      --text-muted: #9cc4b0;
      --glass-bg: rgba(7, 22, 14, 0.62);
      --glass-border: rgba(110, 231, 183, 0.22);
      --mx: 50%;
      --my: 50%;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
      background: radial-gradient(circle at 20% 20%, var(--bg-canopy) 0%, var(--bg-deep) 70%);
      color: var(--text-main);
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    #sporeCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .ambient-glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(110px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.28;
    }

    .orb-one {
      width: 44vw;
      height: 44vw;
      min-width: 280px;
      min-height: 280px;
      top: -12%;
      left: -10%;
      background: radial-gradient(circle, var(--emerald), transparent 70%);
      animation: floatOrb 16s ease-in-out infinite alternate;
    }

    .orb-two {
      width: 40vw;
      height: 40vw;
      min-width: 260px;
      min-height: 260px;
      bottom: -14%;
      right: -8%;
      background: radial-gradient(circle, var(--cyan), transparent 70%);
      animation: floatOrb 20s ease-in-out infinite alternate-reverse;
    }

    .botanical-frame {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }

    .flora {
      position: absolute;
      width: clamp(220px, 34vw, 430px);
      height: auto;
      filter: drop-shadow(0 0 16px rgba(52, 245, 163, 0.28));
      transition: filter 0.5s ease;
    }

    .flora-tl { top: -10px; left: -10px; }
    .flora-br { bottom: -10px; right: -10px; }

    .botanical-frame.surge .flora {
      filter: drop-shadow(0 0 34px rgba(52, 245, 163, 0.75));
    }

    .leaf-edge { opacity: 0.55; }

    .glow-vein {
      stroke-linecap: round;
      stroke-dasharray: 280;
      stroke-dashoffset: 280;
      filter: drop-shadow(0 0 8px var(--emerald));
      animation: veinTrace 5.5s ease-in-out infinite;
    }

    .delay-1 { animation-delay: 0.9s; }
    .delay-2 { animation-delay: 1.8s; }
    .delay-3 { animation-delay: 2.6s; }

    .sway-slow { transform-origin: 0 0; animation: sway 9s ease-in-out infinite; }
    .sway-medium { transform-origin: 0 120px; animation: sway 6.5s ease-in-out infinite reverse; }
    .sway-slow-rev { transform-origin: 380px 380px; animation: swayRev 9.5s ease-in-out infinite; }
    .sway-medium-rev { transform-origin: 380px 220px; animation: swayRev 7s ease-in-out infinite reverse; }

    .stage {
      position: relative;
      z-index: 3;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      perspective: 1200px;
    }

    .card {
      position: relative;
      width: min(640px, 100%);
      padding: clamp(2rem, 4.5vw, 3.2rem);
      border-radius: 26px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow:
        0 24px 70px rgba(0, 0, 0, 0.65),
        0 0 45px rgba(52, 245, 163, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      overflow: hidden;
      transform-style: preserve-3d;
      transition: transform 0.22s ease-out;
      animation: cardEnter 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .card-spotlight {
      position: absolute;
      inset: 0;
      background: radial-gradient(420px circle at var(--mx) var(--my), rgba(52, 245, 163, 0.16), transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    .card-border-glow {
      position: absolute;
      inset: -1px;
      border-radius: 26px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(52, 245, 163, 0.55), transparent 45%, rgba(34, 211, 238, 0.45));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0.65;
    }

    .card > *:not(.card-spotlight):not(.card-border-glow) {
      position: relative;
      z-index: 2;
    }

    .card-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 1.75rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.42rem 0.9rem;
      border-radius: 999px;
      background: rgba(52, 245, 163, 0.1);
      border: 1px solid rgba(52, 245, 163, 0.32);
      font-family: "JetBrains Mono", "Fira Code", monospace;
      font-size: 0.74rem;
      letter-spacing: 0.08em;
      color: var(--mint);
      box-shadow: 0 0 18px rgba(52, 245, 163, 0.16);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 10px var(--emerald), 0 0 20px var(--emerald);
      animation: dotBeacon 2s ease-in-out infinite;
    }

    .specimen-id {
      font-family: "JetBrains Mono", "Fira Code", monospace;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      color: rgba(156, 196, 176, 0.65);
    }

    .name {
      font-size: clamp(2rem, 5vw, 3.1rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.02em;
      background: linear-gradient(120deg, #ffffff 10%, var(--mint) 55%, var(--cyan) 95%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 16px rgba(52, 245, 163, 0.24));
      animation: shimmerTitle 8s ease-in-out infinite;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      margin: 1.35rem 0;
    }

    .divider .line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(52, 245, 163, 0.45), transparent);
    }

    .divider .line:first-child {
      background: linear-gradient(90deg, transparent, rgba(52, 245, 163, 0.45));
    }

    .sprout-icon {
      width: 24px;
      height: 24px;
      filter: drop-shadow(0 0 8px var(--emerald));
      animation: sproutBreath 3.5s ease-in-out infinite;
    }

    .intro {
      font-size: clamp(1rem, 2.2vw, 1.12rem);
      line-height: 1.75;
      color: var(--text-muted);
      max-width: 54ch;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(45px, 30px) scale(1.12); }
    }
    @keyframes sway {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(3.2deg); }
    }
    @keyframes swayRev {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-3.2deg); }
    }
    @keyframes veinTrace {
      0% { stroke-dashoffset: 280; opacity: 0.25; }
      45% { stroke-dashoffset: 0; opacity: 1; }
      75% { stroke-dashoffset: 0; opacity: 0.85; }
      100% { stroke-dashoffset: -280; opacity: 0.2; }
    }
    @keyframes dotBeacon {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.65; }
    }
    @keyframes shimmerTitle {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    @keyframes sproutBreath {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }
    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body>
  <canvas id="sporeCanvas" aria-hidden="true"></canvas>

  <div class="ambient-glow orb-one" aria-hidden="true"></div>
  <div class="ambient-glow orb-two" aria-hidden="true"></div>

  <div class="botanical-frame" id="botanicalFrame" aria-hidden="true">
    <svg class="flora flora-tl" viewBox="0 0 360 360" fill="none">
      <defs>
        <linearGradient id="leafGrad1" x1="0" y1="0" x2="320" y2="320" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#0a2e1f" stop-opacity="0.95" />
          <stop offset="100%" stop-color="#10b981" stop-opacity="0.28" />
        </linearGradient>
        <linearGradient id="veinGrad1" x1="0" y1="0" x2="280" y2="280" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#34f5a3" />
          <stop offset="100%" stop-color="#22d3ee" />
        </linearGradient>
      </defs>
      <g class="sway-slow">
        <path class="leaf-body" d="M-10,-10 C80,10 190,65 250,175 C175,205 70,175 -10,95 Z" fill="url(#leafGrad1)" />
        <path class="leaf-edge" d="M-10,-10 C80,10 190,65 250,175 C175,205 70,175 -10,95" stroke="url(#veinGrad1)" stroke-width="1.5" />
        <path class="glow-vein" d="M-5,-5 C75,45 155,105 245,172" stroke="url(#veinGrad1)" stroke-width="2" />
        <path class="glow-vein delay-1" d="M60,36 C95,28 135,34 165,55" stroke="#6ee7b7" stroke-width="1.2" />
        <path class="glow-vein delay-2" d="M115,72 C105,112 92,140 65,155" stroke="#6ee7b7" stroke-width="1.2" />
        <path class="glow-vein delay-3" d="M162,106 C192,102 212,115 225,134" stroke="#34f5a3" stroke-width="1.1" />
      </g>
      <g class="sway-medium">
        <path class="leaf-body" d="M-15,120 C50,140 120,195 145,285 C75,295 18,245 -15,190 Z" fill="url(#leafGrad1)" />
        <path class="leaf-edge" d="M-15,120 C50,140 120,195 145,285 C75,295 18,245 -15,190" stroke="#34f5a3" stroke-width="1.2" />
        <path class="glow-vein delay-2" d="M-10,130 C48,175 95,220 142,280" stroke="#34f5a3" stroke-width="1.6" />
      </g>
    </svg>

    <svg class="flora flora-br" viewBox="0 0 380 380" fill="none">
      <defs>
        <linearGradient id="leafGrad2" x1="380" y1="380" x2="60" y2="60" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#08291d" stop-opacity="0.95" />
          <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.22" />
        </linearGradient>
      </defs>
      <g class="sway-slow-rev">
        <path class="leaf-body" d="M390,390 C280,365 170,295 105,175 C190,140 300,175 390,265 Z" fill="url(#leafGrad2)" />
        <path class="leaf-edge" d="M390,390 C280,365 170,295 105,175 C190,140 300,175 390,265" stroke="#34f5a3" stroke-width="1.5" />
        <path class="glow-vein" d="M385,385 C290,320 205,255 112,178" stroke="#34f5a3" stroke-width="2.1" />
        <path class="glow-vein delay-1" d="M300,324 C255,335 215,322 180,292" stroke="#22d3ee" stroke-width="1.2" />
        <path class="glow-vein delay-2" d="M235,274 C250,230 268,202 298,185" stroke="#6ee7b7" stroke-width="1.2" />
        <path class="glow-vein delay-3" d="M175,228 C145,232 128,220 116,202" stroke="#34f5a3" stroke-width="1.1" />
      </g>
      <g class="sway-medium-rev">
        <path class="leaf-body" d="M390,220 C320,200 250,140 225,55 C295,48 355,95 390,155 Z" fill="url(#leafGrad2)" />
        <path class="leaf-edge" d="M390,220 C320,200 250,140 225,55 C295,48 355,95 390,155" stroke="#6ee7b7" stroke-width="1.2" />
        <path class="glow-vein delay-1" d="M385,212 C325,165 275,118 228,60" stroke="#6ee7b7" stroke-width="1.5" />
      </g>
    </svg>
  </div>

  <main class="stage">
    <article class="card" id="profileCard">
      <div class="card-spotlight"></div>
      <div class="card-border-glow"></div>

      <header class="card-header">
        <div class="badge">
          <span class="pulse-dot"></span>
          <span>BS COMPUTER SCIENCE · CS1A</span>
        </div>
        <span class="specimen-id">FLORA // 01</span>
      </header>

      <section class="identity">
        <h1 class="name">Ethan Luke G. Laroscain</h1>
        <div class="divider">
          <span class="line"></span>
          <svg class="sprout-icon" viewBox="0 0 24 24" fill="none">
            <path d="M12 21V11" stroke="#34f5a3" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M12 13C12 8.5 16 5 20.5 5C20.5 9.5 17 13 12 13Z" stroke="#34f5a3" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M12 15C12 11 8.5 8 4 8C4 12.5 7.5 15 12 15Z" stroke="#6ee7b7" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
          <span class="line"></span>
        </div>
        <p class="intro">
          First-year CS1A student at Ateneo de Davao University. Outside of class, I mostly enjoy taking long walks, being around greenery, and slowing down enough to actually enjoy the world around me.
        </p>
      </section>
    </article>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById("sporeCanvas");
      const ctx = canvas.getContext("2d");
      const card = document.getElementById("profileCard");
      const botanicalFrame = document.getElementById("botanicalFrame");

      let width = window.innerWidth;
      let height = window.innerHeight;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);

      const pointer = { x: width / 2, y: height / 2, active: false };
      const palette = ["#34f5a3", "#6ee7b7", "#22d3ee", "#a7f3d0"];
      const spores = [];
      const ripples = [];
      const bursts = [];

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      class Spore {
        constructor() { this.reset(true); }
        reset(initial = false) {
          this.x = Math.random() * width;
          this.y = initial ? Math.random() * height : height + 20;
          this.radius = 1.2 + Math.random() * 2.6;
          this.vx = (Math.random() - 0.5) * 0.45;
          this.vy = -(0.22 + Math.random() * 0.55);
          this.phase = Math.random() * Math.PI * 2;
          this.pulseSpeed = 0.015 + Math.random() * 0.025;
          this.color = palette[Math.floor(Math.random() * palette.length)];
        }
        update() {
          this.phase += this.pulseSpeed;
          this.x += this.vx + Math.sin(this.phase * 0.7) * 0.2;
          this.y += this.vy;
          if (pointer.active) {
            const dx = this.x - pointer.x;
            const dy = this.y - pointer.y;
            const dist = Math.hypot(dx, dy);
            if (dist > 1 && dist < 150) {
              const force = (1 - dist / 150) * 0.85;
              this.x += (dx / dist) * force;
              this.y += (dy / dist) * force;
            }
          }
          if (this.y < -20 || this.x < -30 || this.x > width + 30) this.reset(false);
        }
        draw() {
          const alpha = 0.28 + ((Math.sin(this.phase) + 1) / 2) * 0.65;
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.shadowBlur = 12;
          ctx.shadowColor = this.color;
          ctx.fillStyle = this.color;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      class Ripple {
        constructor(x, y) {
          this.x = x;
          this.y = y;
          this.radius = 8;
          this.maxRadius = Math.max(width, height) * 0.45;
          this.alpha = 0.75;
        }
        update() { this.radius += 7.5; this.alpha *= 0.962; }
        draw() {
          ctx.save();
          ctx.strokeStyle = "#34f5a3";
          ctx.globalAlpha = this.alpha;
          ctx.lineWidth = 2;
          ctx.shadowBlur = 16;
          ctx.shadowColor = "#34f5a3";
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
        get dead() { return this.alpha < 0.02 || this.radius > this.maxRadius; }
      }

      class BurstParticle {
        constructor(x, y) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 1.5 + Math.random() * 4.2;
          this.x = x;
          this.y = y;
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed;
          this.radius = 1.4 + Math.random() * 2;
          this.alpha = 1;
          this.color = palette[Math.floor(Math.random() * palette.length)];
        }
        update() {
          this.x += this.vx;
          this.y += this.vy;
          this.vx *= 0.96;
          this.vy *= 0.96;
          this.alpha *= 0.93;
        }
        draw() {
          ctx.save();
          ctx.globalAlpha = this.alpha;
          ctx.shadowBlur = 14;
          ctx.shadowColor = this.color;
          ctx.fillStyle = this.color;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        get dead() { return this.alpha < 0.03; }
      }

      function spawnBioluminescentPulse(x, y) {
        ripples.push(new Ripple(x, y));
        for (let i = 0; i < 24; i++) bursts.push(new BurstParticle(x, y));
        botanicalFrame.classList.add("surge");
        window.setTimeout(() => botanicalFrame.classList.remove("surge"), 650);
      }

      function drawMyceliumLinks() {
        if (!pointer.active) return;
        const nearby = spores.filter((s) => Math.hypot(s.x - pointer.x, s.y - pointer.y) < 175);
        ctx.save();
        for (let i = 0; i < nearby.length; i++) {
          for (let j = i + 1; j < nearby.length; j++) {
            const d = Math.hypot(nearby[i].x - nearby[j].x, nearby[i].y - nearby[j].y);
            if (d < 95) {
              ctx.strokeStyle = "rgba(52, 245, 163, " + ((1 - d / 95) * 0.26).toFixed(3) + ")";
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(nearby[i].x, nearby[i].y);
              ctx.lineTo(nearby[j].x, nearby[j].y);
              ctx.stroke();
            }
          }
        }
        ctx.restore();
      }

      function animate() {
        ctx.clearRect(0, 0, width, height);
        drawMyceliumLinks();
        for (const s of spores) { s.update(); s.draw(); }
        for (let i = ripples.length - 1; i >= 0; i--) {
          ripples[i].update(); ripples[i].draw();
          if (ripples[i].dead) ripples.splice(i, 1);
        }
        for (let i = bursts.length - 1; i >= 0; i--) {
          bursts[i].update(); bursts[i].draw();
          if (bursts[i].dead) bursts.splice(i, 1);
        }
        requestAnimationFrame(animate);
      }

      window.addEventListener("resize", resize);
      window.addEventListener("mousemove", (e) => {
        pointer.x = e.clientX;
        pointer.y = e.clientY;
        pointer.active = true;
        const rect = card.getBoundingClientRect();
        card.style.setProperty("--mx", `${((e.clientX - rect.left) / rect.width) * 100}%`);
        card.style.setProperty("--my", `${((e.clientY - rect.top) / rect.height) * 100}%`);
        const rotateY = ((e.clientX - (rect.left + rect.width / 2)) / width) * 9;
        const rotateX = -((e.clientY - (rect.top + rect.height / 2)) / height) * 9;
        card.style.transform = `rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg)`;
      });
      window.addEventListener("mouseleave", () => {
        pointer.active = false;
        card.style.transform = "rotateX(0deg) rotateY(0deg)";
      });
      window.addEventListener("click", (e) => {
        spawnBioluminescentPulse(e.clientX, e.clientY);
      });

      resize();
      const count = Math.min(85, Math.max(45, Math.floor((width * height) / 18000)));
      for (let i = 0; i < count; i++) spores.push(new Spore());
      animate();
    })();
  </script>
</body>
</html>
